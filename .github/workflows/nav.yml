name: Collect and publish NAV history

on:
  schedule:
    - cron: '32 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-static-data
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_failure: ${{ steps.sync.outputs.source_failure }}
      failed_sources: ${{ steps.sync.outputs.failed_sources }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and vet
        run: |
          go build -o "$RUNNER_TEMP/navcollector" ./cmd/navcollector
          go vet ./...
      - name: Install PDF text extraction for official monthly reports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Supply Global IME's missing intermediate certificate
        id: ca
        continue-on-error: true
        run: |
          bash scripts/globalime-ca-bundle.sh "$RUNNER_TEMP/nav-ca.pem"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/nav-ca.pem" >> "$GITHUB_ENV"
      - name: Fetch official histories
        id: sync
        run: |
          "$RUNNER_TEMP/navcollector" sync 2>&1 | tee "$RUNNER_TEMP/sync.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 2 ]; then
            # Adapter names are fixed in sources.All(), so the log is the only record
            # of which ones stayed unavailable after the collector exhausted its retries.
            failed=$(sed -n 's/^FAILED \([^:]*\):.*/\1/p' "$RUNNER_TEMP/sync.log" | sort -u | tr '\n' ' ')
            {
              echo 'source_failure=true'
              echo "failed_sources=${failed% }"
            } >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Validate published data
        run: '"$RUNNER_TEMP/navcollector" validate'
      - name: Commit changed static data only
        run: |
          git add -- data/*.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: sync official NAV histories'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

  # A source that stays down after the collector's retries is an upstream outage, not a
  # defect in this repository: healthy snapshots are already published and the prior
  # snapshot is retained. Annotate the run instead of failing it, so a red run keeps
  # meaning the collector itself broke.
  source-status:
    needs: collect
    if: always() && needs.collect.outputs.source_failure == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Warn about sources unavailable after retries
        env:
          FAILED_SOURCES: ${{ needs.collect.outputs.failed_sources }}
        run: |
          echo "::warning title=NAV sources unavailable::Retries exhausted for: ${FAILED_SOURCES:-unknown}. Prior snapshots were retained and healthy sources were published."
          {
            echo '### NAV sources unavailable'
            echo
            echo "Retries exhausted for: \`${FAILED_SOURCES:-unknown}\`"
            echo
            echo 'Prior snapshots were retained and every healthy source was published.'
            echo 'Inspect the collect job log if the same source fails on consecutive days.'
          } >> "$GITHUB_STEP_SUMMARY"
