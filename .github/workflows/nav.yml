name: Collect and publish NAV history

on:
  schedule:
    - cron: '32 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-static-data
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_failure: ${{ steps.sync.outputs.source_failure }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and vet
        run: |
          go build -o "$RUNNER_TEMP/navcollector" ./cmd/navcollector
          go vet ./...
      - name: Supply Global IME's missing intermediate certificate
        id: ca
        continue-on-error: true
        run: |
          bash scripts/globalime-ca-bundle.sh "$RUNNER_TEMP/nav-ca.pem"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/nav-ca.pem" >> "$GITHUB_ENV"
      - name: Fetch official histories
        id: sync
        run: |
          status=0
          "$RUNNER_TEMP/navcollector" sync || status=$?
          if [ "$status" -eq 2 ]; then
            echo 'source_failure=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Validate published data
        run: '"$RUNNER_TEMP/navcollector" validate'
      - name: Commit changed static data only
        run: |
          git add -- data/*.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: sync official NAV histories'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

  source-status:
    needs: collect
    if: always() && needs.collect.outputs.source_failure == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report failed source after saving healthy snapshots
        run: |
          echo 'One or more sources failed. Prior snapshots were retained; inspect the collector log.'
          exit 1
